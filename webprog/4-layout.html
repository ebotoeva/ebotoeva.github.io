<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Simple Layout Example</title>
</head>
<body>

  <header>
    <h1>My Website</h1>
  </header>

  <nav>
    <ul>
      <li><a href="#">Home</a></li>
      <li><a href="#">About</a></li>
      <li><a href="#">Contact</a></li>
    </ul>
  </nav>

  <main>
    <h2>Main Content</h2>
    <p>This is the main content of the page.</p>
  </main>

  <aside>
    <h2>Related</h2>
    <p>Extra information, links, or ads go here.</p>
  </aside>

  <footer>
    <p>© 2026 My Website</p>
  </footer>

</body>
</html>
